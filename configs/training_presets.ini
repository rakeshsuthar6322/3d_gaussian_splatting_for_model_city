# Training Configuration Presets for Splatfacto
# ==============================================
# These are the key parameters that control Gaussian Splatting training quality.
# Use them with: ns-train splatfacto --pipeline.model.<param> <value>

# ── Default (Balanced) ───────────────────────────────────────────────────────
# Good starting point for most scenes.
[default]
max_num_iterations = 30000
densify_grad_thresh = 0.0008
stop_split_at = 15000
cull_alpha_thresh = 0.1
cull_scale_thresh = 0.5

# ── Aggressive Densification ─────────────────────────────────────────────────
# Use when scene has large holes in floors/walls. Fills gaps aggressively.
# Warning: May produce more floaters that need post-processing cleanup.
[aggressive]
max_num_iterations = 30000
densify_grad_thresh = 0.0001
stop_split_at = 25000
cull_alpha_thresh = 0.05
cull_scale_thresh = 0.5

# ── Refined (Best Quality) ───────────────────────────────────────────────────
# Best balance of hole-filling and color detail. Recommended for final exports.
# Stops densification at 15k to give 15k iterations for pure color optimization.
# Lowers cull_scale_thresh to prevent large clumpy splats in detailed areas.
[refined]
max_num_iterations = 30000
densify_grad_thresh = 0.0002
stop_split_at = 15000
cull_alpha_thresh = 0.1
cull_scale_thresh = 0.2
